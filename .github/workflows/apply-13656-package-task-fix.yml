name: Apply package-task composition fix

on:
  push:
    branches:
      - fix/13656-package-task-clean

permissions:
  contents: write

env:
  TURBO_TELEMETRY_MESSAGE_DISABLED: "1"

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout clean candidate branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: fix/13656-package-task-clean
          fetch-depth: 0

      - name: Apply explicit package-task inclusion
        shell: python
        run: |
          from pathlib import Path

          path = Path("crates/turborepo-lib/src/run/builder.rs")
          text = path.read_text()

          replacements = [
              (
                  '''                task_level_affected_package_scope.as_ref(),
            )?;''',
                  '''                task_level_affected_package_scope.as_ref(),
                &explicitly_requested_tasks,
            )?;''',
                  "affected call site",
              ),
              (
                  '''        package_scope: Option<&HashSet<PackageName>>,
    ) -> Result<(Engine, Option<HashSet<PackageName>>), Error> {''',
                  '''        package_scope: Option<&HashSet<PackageName>>,
        always_include: &HashSet<TaskId<'static>>,
    ) -> Result<(Engine, Option<HashSet<PackageName>>), Error> {''',
                  "affected function signature",
              ),
              (
                  '''                let selected_packages = affected_entrypoints
                    .iter()
                    .map(|task| PackageName::from(task.package()))
                    .collect();
                let affected_entrypoints =
                    super::task_filter::expand_with_siblings(&engine, affected_entrypoints);''',
                  '''                let selected_packages = affected_entrypoints
                    .iter()
                    .map(|task| PackageName::from(task.package()))
                    .collect();
                affected_entrypoints.extend(always_include.iter().cloned());
                let affected_entrypoints =
                    super::task_filter::expand_with_siblings(&engine, affected_entrypoints);''',
                  "successful affected path",
              ),
              (
                  '''                let scoped_tasks = engine.task_ids_for_packages(package_scope);
                let scoped_tasks = super::task_filter::expand_with_siblings(&engine, scoped_tasks);
                Ok((engine.retain_filtered_tasks(&scoped_tasks), None))''',
                  '''                let mut scoped_tasks = engine.task_ids_for_packages(package_scope);
                scoped_tasks.extend(always_include.iter().cloned());
                let scoped_tasks = super::task_filter::expand_with_siblings(&engine, scoped_tasks);
                Ok((engine.retain_filtered_tasks(&scoped_tasks), None))''',
                  "fail-open affected path",
              ),
          ]

          for old, new, label in replacements:
              if old in text:
                  assert text.count(old) == 1, f"{label} matched more than once"
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise SystemExit(f"{label} did not match expected source")

          path.write_text(text)

      - name: Setup Node
        uses: ./.github/actions/setup-node
        with:
          node-version: "18.20.2"
          package-install: "false"
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          shared-cache-key: round-004-package-task-fix
          save-cache: false
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Setup Zig
        uses: ./.github/actions/setup-zig

      - name: Setup capnproto
        uses: ./.github/actions/setup-capnproto

      - name: Format
        run: cargo fmt --all

      - name: Run package-task authority matrix
        run: cargo test --locked -p turbo --test affected_task_filter_package_task_test -- --nocapture

      - name: Run package-scope controls
        run: cargo test --locked -p turbo --test affected_task_filter_intersection_test -- --nocapture

      - name: Run dependency-closure control
        run: cargo test --locked -p turbo --test affected_task_filter_dependency_closure_test -- --nocapture

      - name: Run entrypoint-policy controls
        run: cargo test --locked -p turbo --test affected_task_filter_legacy_entrypoint_test -- --nocapture

      - name: Run upstream affected suite
        run: cargo test --locked -p turbo --test affected_test -- --nocapture

      - name: Run clippy
        run: cargo clippy --locked -p turborepo-lib -p turbo --all-targets --features rustls-tls --no-deps -- -D warnings

      - name: Commit clean source candidate
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code --check
          changed=$(git diff --name-only)
          test "$changed" = "crates/turborepo-lib/src/run/builder.rs"
          git config user.name "teamleaderleo"
          git config user.email "13091533+teamleaderleo@users.noreply.github.com"
          git add crates/turborepo-lib/src/run/builder.rs
          git rm .github/workflows/apply-13656-package-task-fix.yml
          git commit -m "fix: preserve package tasks in task-input affected runs"
          git push origin HEAD:fix/13656-package-task-clean
