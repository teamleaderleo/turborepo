name: Round 004 affected-filter controls

on:
  push:
    branches:
      - verify/13656-round-004-controls
  pull_request:
    branches:
      - review-base/13656

permissions:
  contents: read

concurrency:
  group: round-004-affected-filter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  controls:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: ./.github/actions/setup-node
        with:
          node-version: "18.20.2"
          package-install: "false"
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          shared-cache-key: round-004-affected-filter-controls
          save-cache: false
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Setup Zig
        uses: ./.github/actions/setup-zig

      - name: Setup capnproto
        uses: ./.github/actions/setup-capnproto

      - name: Run package-scope controls
        run: cargo test --locked -p turbo --test affected_task_filter_intersection_test -- --nocapture

      - name: Run dependency-closure control
        run: cargo test --locked -p turbo --test affected_task_filter_dependency_closure_test -- --nocapture

      - name: Run entrypoint-policy controls
        run: cargo test --locked -p turbo --test affected_task_filter_legacy_entrypoint_test -- --nocapture

      - name: Compare package-task authority across affected paths
        run: cargo test --locked -p turbo --test affected_task_filter_package_task_test -- --nocapture
