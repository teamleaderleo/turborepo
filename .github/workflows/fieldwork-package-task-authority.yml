name: Fieldwork package-task authority

on:
  pull_request:
    branches:
      - execution-base/13656-package-task
  push:
    branches:
      - execution/13656-package-task

permissions:
  contents: read

concurrency:
  group: fieldwork-package-task-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: ./.github/actions/setup-node
        with:
          node-version: "18.20.2"
          package-install: "false"
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          shared-cache-key: fieldwork-package-task-baseline
          save-cache: false
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Setup Zig
        uses: ./.github/actions/setup-zig

      - name: Setup capnproto
        uses: ./.github/actions/setup-capnproto

      - name: Confirm current package-task path divergence
        shell: bash
        run: |
          set +e
          cargo test --locked -p turbo --test affected_task_filter_package_task_test task_input_affected_preserves_package_qualified_task -- --exact --nocapture
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Expected the separate task-input affected path to fail the package-qualified task contract"
            exit 1
          fi

  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Apply bounded package-task candidate
        shell: python
        run: |
          from pathlib import Path

          path = Path("crates/turborepo-lib/src/run/builder.rs")
          source = path.read_text()

          call_old = '''            let (affected_engine, selected_packages) = self.filter_engine_to_affected_tasks(
                engine,
                &pkg_dep_graph,
                &root_turbo_json,
                &scm,
                task_level_affected_package_scope.as_ref(),
            )?;'''
          call_new = '''            let (affected_engine, selected_packages) = self.filter_engine_to_affected_tasks(
                engine,
                &pkg_dep_graph,
                &root_turbo_json,
                &scm,
                task_level_affected_package_scope.as_ref(),
                &explicitly_requested_tasks,
            )?;'''
          if source.count(call_old) != 1:
              raise SystemExit(f"expected one affected-filter call, found {source.count(call_old)}")
          source = source.replace(call_old, call_new, 1)

          signature_old = '''        scm: &SCM,
        package_scope: Option<&HashSet<PackageName>>,
    ) -> Result<(Engine, Option<HashSet<PackageName>>), Error> {'''
          signature_new = '''        scm: &SCM,
        package_scope: Option<&HashSet<PackageName>>,
        always_include: &HashSet<TaskId<'static>>,
    ) -> Result<(Engine, Option<HashSet<PackageName>>), Error> {'''
          if source.count(signature_old) != 1:
              raise SystemExit(f"expected one affected-filter signature, found {source.count(signature_old)}")
          source = source.replace(signature_old, signature_new, 1)

          success_old = '''                let selected_packages = affected_entrypoints
                    .iter()
                    .map(|task| PackageName::from(task.package()))
                    .collect();
                let affected_entrypoints =
                    super::task_filter::expand_with_siblings(&engine, affected_entrypoints);'''
          success_new = '''                let selected_packages = affected_entrypoints
                    .iter()
                    .map(|task| PackageName::from(task.package()))
                    .collect();
                affected_entrypoints.extend(always_include.iter().cloned());
                let affected_entrypoints =
                    super::task_filter::expand_with_siblings(&engine, affected_entrypoints);'''
          if source.count(success_old) != 1:
              raise SystemExit(f"expected one successful affected-entrypoint block, found {source.count(success_old)}")
          source = source.replace(success_old, success_new, 1)

          fallback_old = '''                let scoped_tasks = engine.task_ids_for_packages(package_scope);
                let scoped_tasks = super::task_filter::expand_with_siblings(&engine, scoped_tasks);
                Ok((engine.retain_filtered_tasks(&scoped_tasks), None))'''
          fallback_new = '''                let mut scoped_tasks = engine.task_ids_for_packages(package_scope);
                scoped_tasks.extend(always_include.iter().cloned());
                let scoped_tasks = super::task_filter::expand_with_siblings(&engine, scoped_tasks);
                Ok((engine.retain_filtered_tasks(&scoped_tasks), None))'''
          if source.count(fallback_old) != 1:
              raise SystemExit(f"expected one fail-open scoped block, found {source.count(fallback_old)}")
          source = source.replace(fallback_old, fallback_new, 1)

          path.write_text(source)

      - name: Setup Node
        uses: ./.github/actions/setup-node
        with:
          node-version: "18.20.2"
          package-install: "false"
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          shared-cache-key: fieldwork-package-task-candidate
          save-cache: false
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Setup Zig
        uses: ./.github/actions/setup-zig

      - name: Setup capnproto
        uses: ./.github/actions/setup-capnproto

      - name: Format candidate
        run: cargo fmt --all

      - name: Run package-task paired matrix
        run: cargo test --locked -p turbo --test affected_task_filter_package_task_test -- --nocapture

      - name: Run owned package-scope controls
        run: cargo test --locked -p turbo --test affected_task_filter_intersection_test -- --nocapture

      - name: Run owned dependency-closure control
        run: cargo test --locked -p turbo --test affected_task_filter_dependency_closure_test -- --nocapture

      - name: Run owned entrypoint-policy controls
        run: cargo test --locked -p turbo --test affected_task_filter_legacy_entrypoint_test -- --nocapture

      - name: Run upstream affected suite
        run: cargo test --locked -p turbo --test affected_test -- --nocapture

      - name: Run clippy
        run: cargo clippy --locked -p turborepo-lib -p turbo --all-targets --features rustls-tls --no-deps -- -D warnings

      - name: Check candidate fence
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only | sort)" = "crates/turborepo-lib/src/run/builder.rs"
